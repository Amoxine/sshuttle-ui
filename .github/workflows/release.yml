name: Release

# Builds installers for macOS, Linux, and Windows and uploads them to the
# matching GitHub Release. Triggered when:
#   1. A v* tag is pushed (automatic after semantic-release), or
#   2. You run this workflow manually (Actions → Release → Run workflow).
#
# Signing secrets (TAURI_SIGNING_*) are optional. Without them, installers
# still build and upload; only signed auto-update artifacts are skipped.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (e.g. v1.0.0). Required for manual runs."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            tauriArgs: --config src-tauri/tauri.ci.conf.json --target universal-apple-darwin
          - platform: ubuntu-22.04
            tauriArgs: --config src-tauri/tauri.ci.conf.json
          - platform: windows-latest
            tauriArgs: --config src-tauri/tauri.ci.conf.json

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "::error::Expected tag like v1.0.0, got: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release $TAG on ${{ matrix.platform }}"

      - name: Clean stale DMG mounts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          for vol in "/Volumes/sshuttle UI" "/Volumes/sshuttle-ui"; do
            hdiutil detach "$vol" 2>/dev/null || true
          done
          rm -rf "$RUNNER_TEMP/tauri-dmg-"* 2>/dev/null || true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust targets (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux dependencies (WebKit + GTK)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS deps
        run: npm ci

      - name: Prepare Tauri CI config
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/prepare-tauri-ci-config.mjs

      - name: Signing status
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "Updater signing: enabled (TAURI_SIGNING_PRIVATE_KEY is set)"
          else
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY not set — building unsigned installers only (no .sig updater bundles)."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: ${{ matrix.tauriArgs }}
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: "sshuttle UI ${{ steps.meta.outputs.tag }}"
          releaseBody: |
            Cross-platform installers for **sshuttle UI** ${{ steps.meta.outputs.tag }}.

            | Platform | Files |
            | --- | --- |
            | macOS (Apple Silicon + Intel) | `.dmg` |
            | Linux | `.deb`, `.AppImage` |
            | Windows | `.msi`, `.exe` (NSIS) |

            **Note:** macOS builds may require allowing the app in *System Settings → Privacy & Security* on first launch when not notarized. Linux `.deb` expects `sshuttle` on `PATH`.
          releaseDraft: false
          prerelease: false
