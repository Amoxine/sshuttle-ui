name: Release

# Builds installers for macOS, Linux, and Windows and uploads them to the
# matching GitHub Release. Triggered when:
#   1. A v* tag is pushed (automatic after semantic-release), or
#   2. You run this workflow manually (Actions → Release → Run workflow).
#
# Signing secrets (TAURI_SIGNING_*) are optional. Without them, installers
# still build and upload; only signed auto-update artifacts are skipped.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag (e.g. v1.0.2). Created/updated by tauri-action if missing."
        required: true
        type: string
      ref:
        description: "Git ref to build (e.g. main). Default: refs/tags/<tag> — use main to pick up fixes not yet on the tag."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            tauriArgs: --config src-tauri/tauri.ci.conf.json --target universal-apple-darwin
          - platform: ubuntu-22.04
            tauriArgs: --config src-tauri/tauri.ci.conf.json
          - platform: windows-latest
            tauriArgs: --config src-tauri/tauri.ci.conf.json

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref != '' && inputs.ref || format('refs/tags/{0}', inputs.tag)) || github.ref }}

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "::error::Expected tag like v1.0.0, got: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release $TAG on ${{ matrix.platform }}"

      - name: Clean stale DMG mounts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          for vol in "/Volumes/sshuttle UI" "/Volumes/sshuttle-ui"; do
            hdiutil detach "$vol" 2>/dev/null || true
          done
          rm -rf "$RUNNER_TEMP/tauri-dmg-"* 2>/dev/null || true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust targets (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux dependencies (WebKit + GTK)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS deps
        run: npm ci

      - name: Prepare Tauri CI config
        id: tauri_ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: node scripts/prepare-tauri-ci-config.mjs

      - name: Verify CI Tauri config (no empty updater pubkey)
        shell: bash
        run: |
          set -euo pipefail
          echo "--- plugins in tauri.ci.conf.json ---"
          node -e "
            const c=require('./src-tauri/tauri.ci.conf.json');
            console.log(JSON.stringify(c.plugins ?? {}, null, 2));
            const pk=c.plugins?.updater?.pubkey;
            if (pk === '' || (pk === undefined && c.bundle?.createUpdaterArtifacts)) {
              console.error('Invalid CI config: updater enabled without pubkey');
              process.exit(1);
            }
            if (pk === '') {
              console.error('Invalid CI config: empty updater pubkey');
              process.exit(1);
            }
          "

      - name: Signing status
        shell: bash
        run: |
          if [ "${{ steps.tauri_ci.outputs.signing_enabled }}" = "true" ]; then
            echo "Updater signing: enabled (valid private + public minisign keys)"
          else
            echo "::notice::Unsigned release build — updater plugin omitted, signing env not passed to tauri build."
          fi

      # Semantic-release creates the GitHub Release + changelog notes when the
      # tag is pushed. Only pass tagName here so tauri-action uploads installers
      # without overwriting the release title or body.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.tauri_ci.outputs.signing_enabled == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.tauri_ci.outputs.signing_enabled == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          projectPath: .
          args: ${{ matrix.tauriArgs }}
          tagName: ${{ steps.meta.outputs.tag }}
